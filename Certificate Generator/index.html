<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>AI ML Certificate Generator</title>
</head>

<body>

    <div class="heading">
        <p>Artificial Intelligence & Machine Learning Certificate</p>
    </div>
    <!-- Container box -->
    <div class="container">
        <form action="page/certificate.html" class="details">
            <div class="form-inp">
                <label for="name">Name</label>
                <input class="inp" type="text" id="name" placeholder="Enter your name" autofocus required>
            </div>

            <div class="form-inp">
                <label for="j-year">Joining</label>
                <input class="inp" type="number" id="j-year" placeholder="Enter joining year" required>
            </div>

            <div class="form-inp">
                <label for="c-year">C-Year</label>
                <input class="inp" type="number" id="c-year" placeholder="Enter year of completion" required>
            </div>

            <div class="form-inp">
                <label>Course</label>
                <select name="courses" required>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="ml">Machine Learning</option>
                </select>
            </div>

            <div class="gender">
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>

            <div class="sbt">
                <input type="submit" id="sb-btn">
            </div>
        </form>
    </div>

    <script src="page/script.js"></script>
</body>

</html>
