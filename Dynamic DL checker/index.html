<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DL Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="input-section">
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age....">
        </div>
        <div class="submit">
            <button id="submit">Submit</button>
        </div>

        <div class="warn" id="notAge"><i style="color: white;" class="bi bi-exclamation-triangle"></i> Invalid Age</div>

        <div class="warn" id="less16"><i style="color: white;" class="bi bi-exclamation-triangle"></i> You are not eligible for DL</div>

        <div class="warn" id="is16"><i style="color: rgb(0, 255, 0);" class="bi bi-check-square"></i> You can apply for Learning DL</div>

        <div class="warn" id="is18"><i style="color: rgb(0, 255, 0);" class="bi bi-check-square"></i> You can apply for DL</div>
        
        <div class="warn" id="greater20"><i style="color: rgb(0, 255, 0);" class="bi bi-check-square"></i> You can apply for both commercial and personal DL</div>

        <div class="warn" id="oldage"><i style="color: white;" class="bi bi-exclamation-triangle"></i> You cannot apply for the DL anymore, stay home and stay healthy</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
