<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
    <title>Funny-HUB.com</title>
</head>

<body>
    <header>
        <div class="hamburger">
            <div class="line line1"></div>
            <div class="line line2"></div>
            <div class="line line3"></div>
        </div>
        <div class="headName">
            <p>Funny HUB</p>
        </div>

    </header>
    <div class="sidebar">

        <div class="dark">
            <i class="bi bi-moon"></i><p>Dark</p>
        </div>

    </div>

    <main>
        <div class="textEditor">
            <h3>Let's Play with Texts!</h3>
            
            <textarea id="textarea" name="message" rows="12" cols="80" placeholder="Type here..."></textarea>
            
            <div class="buttons">
                <button id="increase">Increase</button>
                <button id="decrease">Decrease</button>
                <button id="weight">Weight</button>
                <button id="color">Color</button>

            </div>
                <div class="color-sec">
                    <div class="colour colour1"></div>
                    <div class="colour colour2"></div>
                    <div class="colour colour3"></div>
                    <div class="colour colour4"></div>
                    <div class="colour colour5"></div>
                    <div class="colour colour6"></div>
                    <div class="colour colour7"></div>
                    <div class="colour colour8"></div>
                    <div class="colour colour9"></div>
                    <div class="colour colour10"></div>
                    <div class="colour colour11"></div>
                    <div class="colour colour12"></div>
                </div>
        </div>

    </main>
    <script src="script.js"></script>
</body>

</html>
