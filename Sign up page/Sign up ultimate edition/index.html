<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Heaist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div>
            <h2>Sign Up</h2>
        </div>
        <form>
            <div class="box">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Name" required autofocus>
            </div>
            <div class="box">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
            </div>
            <div class="box">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
            </div>
            <div class="box">
                <label for="details_ac">Review</label>
                <input type="text" id="details_ac" name="review" placeholder="Write your review" required>
            </div>
            <div class="gender">
                <label>Gender</label>
                <div class="gender-options">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="others" name="gender" value="others">
                    <label for="others">Others</label>
                </div>
            </div>
            <div>
                <input type="checkbox" id="loot" name="loot" value="yes">
                <label for="loot">remember me</label>
            </div>
            <div class="btn">
                <a href="https://alpha-to-do-list.netlify.app/" target="_blank" class="sub_btn">Submit</a>
            </div>
        </form>
    </div>
</body>

</html>
